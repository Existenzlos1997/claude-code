name: Sync PZR App to docs/

on:
  push:
    branches:
      - main
      - copilot/setup-installer-for-project
      - copilot/check-all-installers
    paths:
      - 'PZR_App/pzr_app.html'
      - 'PZR_App/manifest.json'
      - 'PZR_App/sw.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync to docs/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync site files to docs/
        run: |
          cp PZR_App/pzr_app.html docs/index.html
          cp PZR_App/pzr_app.html docs/pzr_app.html
          cp PZR_App/manifest.json docs/manifest.json
          cp PZR_App/sw.js docs/sw.js
          echo "✅ docs/ synced:"
          ls -lh docs/

      - name: Commit and push docs/ update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to docs/ — skipping commit"
          else
            git commit -m "sync: update docs/ from PZR_App/ [skip ci]"
            git push
          fi
