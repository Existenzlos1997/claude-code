name: Deploy PZR App to GitHub Pages

on:
  push:
    branches:
      - main
      - copilot/setup-installer-for-project
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to gh-pages branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp PZR_App/pzr_app.html _site/index.html
          cp PZR_App/pzr_app.html _site/pzr_app.html
          cp PZR_App/manifest.json _site/manifest.json
          cp PZR_App/sw.js _site/sw.js
          echo "✅ Site ready:"
          ls -lh _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
