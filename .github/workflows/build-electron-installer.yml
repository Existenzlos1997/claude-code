name: Build Electron Installers
# Builds Windows (.exe), macOS (.dmg) and Linux (.deb) installers via electron-builder

on:
  push:
    branches:
      - main
      - copilot/setup-installer-for-project
      - copilot/check-all-installers
    tags:
      - 'v*'
  workflow_dispatch:

# Allow writing releases from any job in this workflow
permissions:
  contents: write

jobs:
  build:
    name: Build Installers
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy latest app HTML into Electron
        run: cp PZR_App/pzr_app.html PZR_App_Electron/app/pzr_app.html

      - name: Set build date in app HTML
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const file = 'PZR_App_Electron/app/pzr_app.html';
            let c = fs.readFileSync(file, 'utf8');
            const d = new Date().toISOString().substring(0, 10);
            c = c.replace(/const APP_BUILD_DATE = '[0-9]{4}-[0-9]{2}-[0-9]{2}'/, \`const APP_BUILD_DATE = '\${d}'\`);
            fs.writeFileSync(file, c);
            console.log('APP_BUILD_DATE set to', d);
          "

      - name: Install dependencies
        working-directory: PZR_App_Electron
        run: npm install

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        working-directory: PZR_App_Electron
        run: npm run build:win

      - name: Build macOS Installer
        if: matrix.os == 'macos-latest'
        working-directory: PZR_App_Electron
        run: npm run build:mac

      - name: Build Linux Installer
        if: matrix.os == 'ubuntu-latest'
        working-directory: PZR_App_Electron
        run: npm run build:linux

      - name: Upload Windows Installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: PZR_App_Electron/dist/*.exe

      - name: Upload macOS Installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: PZR_App_Electron/dist/*.dmg

      - name: Upload Linux Installer
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: PZR_App_Electron/dist/*.deb

  publish-nightly:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish to nightly pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: "Automatischer Build vom Branch – immer aktuellste Version."
          prerelease: true
          files: |
            windows-installer/*
            macos-installer/*
            linux-installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Create Versioned Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create versioned release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/*
            macos-installer/*
            linux-installer/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
