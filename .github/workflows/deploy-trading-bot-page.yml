name: Deploy Trading Bot Landing Page

on:
  push:
    branches:
      - main
      - copilot/create-trading-bot-research
    paths:
      - 'docs/**'
      - 'TradingBot/install.sh'
      - 'TradingBot/install.bat'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync install scripts to docs/
        run: |
          cp TradingBot/install.sh docs/install.sh
          cp TradingBot/install.bat docs/install.bat

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
